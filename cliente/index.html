<html lang="en">
    <head>
        <title>Gestao de residuos solidos</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <center>
            <H1>Nova gestão de residuos sólidos</H1>
            <form action="http://localhost:3000" method="post">
            <section>
            <b>Obs: id (automático)</b>
                <p>Local:</p>
                <input type="text" name="local" required>
                <p>Tipo do resíduo:</p>
                <input type="text" name="tipo_residuo" required>
                <p>Nível de risco:</p>
                <select name="nivel_risco" required>
                    <option value="alto">alto</option>
                    <option value="medio">médio</option>
                    <option value="baixo">baixo</option>
                </select>
                <p>Data do registro:</p>
                <input type="date" name="data_registro" required>
                <p>Status:</p>
                <select name="status" required>
                    <option value="concluido">concluido</option>
                    <option value="pendente">pendente</option>
                </select>
                <div>
                <button type="reset" class="excluir">Limpar</button>
                <button type="submit" class="enviar">Enviar</button>
                </div>
            </section>
            <footer>Eduardo Moretti</footer>
            </form>
        </center>
    </body>
</html>
